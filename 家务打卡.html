<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家务打卡 · 蛋仔乐园</title>
<style>
  :root{
    --ink:#302b42;--muted:#7d7691;--line:#e7e1ee;--violet:#6c63ff;--violet-soft:#f0efff;
    --green:#2e8a57;--green-soft:#eaf8ef;--amber:#b76d14;--amber-soft:#fff5e6;--red:#b42318;--bg:#fbf9fd;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.5}
  .page{width:min(640px,calc(100% - 24px));margin:0 auto;padding:18px 0 56px}
  /* 登录 */
  #loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(180deg,#fffaff,#fff7fd 52%,#f7fbff)}
  #loginScreen .card{text-align:center;max-width:320px;padding:40px 30px;background:rgba(255,255,255,.92);border-radius:24px;box-shadow:0 18px 40px rgba(136,98,210,.12)}
  #loginScreen .emoji{font-size:48px;margin-bottom:12px}
  #loginScreen h2{font-size:22px;font-weight:900;color:#4a3a66;margin:0 0 8px}
  #loginScreen p{color:#7c6f95;font-size:13px;margin:0 0 24px}
  input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;margin-bottom:10px;text-align:center;box-sizing:border-box;font-family:inherit}
  button{font:inherit;cursor:pointer;border:0;border-radius:12px}
  .btn-primary{width:100%;padding:12px;background:var(--violet);color:#fff;font-size:16px;font-weight:700}
  #loginError{color:var(--red);font-size:12px;margin:12px 0 0;min-height:18px}
  /* 顶栏 */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .topbar .who{font-size:13px;color:var(--muted)}
  .topbar .who b{color:var(--ink);font-size:15px}
  .topbar .acts{display:flex;gap:8px;flex-shrink:0}
  .link-btn{background:transparent;color:var(--violet);font-size:13px;font-weight:600;padding:6px 8px}
  .link-btn.danger{color:var(--red)}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  /* 卡片 */
  .card-box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
  .card-box h3{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:6px}
  /* 补打日期 */
  .date-row{display:flex;align-items:center;gap:10px;margin:0 0 12px}
  .date-row label{font-size:13px;color:var(--muted);white-space:nowrap;font-weight:600}
  .date-row input[type=date]{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);margin:0;text-align:center;box-sizing:border-box;-webkit-appearance:none}
  /* 任务勾选列表 */
  .task-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;max-height:340px;overflow:auto}
  .task-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px}
  .task-item:hover{border-color:var(--violet)}
  .task-item input[type=checkbox]{width:20px;height:20px;accent-color:var(--violet);flex-shrink:0;cursor:pointer}
  .task-item .tname{flex:1;font-weight:600}
  .task-item .tamt{color:var(--green);font-weight:800;font-size:13px;white-space:nowrap}
  .qty-ctrl{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-shrink:0}
  .qty-ctrl button{width:30px;height:30px;background:#f6f3fb;color:var(--violet);font-size:18px;font-weight:800;border-radius:0;line-height:1}
  .qty-ctrl button:active{background:#ece8fa}
  .qty-ctrl input{width:36px;height:30px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0;text-align:center;font-size:14px;font-weight:700;padding:0;margin:0;-moz-appearance:textfield}
  .qty-ctrl input::-webkit-outer-spin-button,.qty-ctrl input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .complete-btn{width:100%;padding:14px;background:linear-gradient(135deg,#7fd0ff,#9f80ff);color:#fff;font-size:16px;font-weight:800}
  .complete-btn:disabled{opacity:.5;cursor:not-allowed}
  .msg{min-height:20px;font-size:13px;margin-top:10px;text-align:center}
  .msg.ok{color:var(--green)} .msg.err{color:var(--red)}
  /* 汇总 */
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
  .summary .box{background:var(--violet-soft);border-radius:14px;padding:12px 6px}
  .summary .label{font-size:12px;color:var(--muted)}
  .summary .val{font-size:20px;font-weight:800;color:var(--violet);margin-top:4px}
  /* 记录列表 */
  .log-item{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line);font-size:14px}
  .log-item:last-child{border-bottom:0}
  .log-item .name{font-weight:600}
  .log-item .amt{color:var(--green);font-weight:800;font-size:15px}
  .log-item .time{color:var(--muted);font-size:11px}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 6px}
  .empty.tip{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:14px;line-height:1.7}
  /* 存钱罐·余额并入收入汇总行 */
  .summary{grid-template-columns:repeat(4,1fr);gap:6px}
  .summary .box{padding:10px 4px}
  .summary .label{font-size:11px}
  .summary .box.balance-box{background:linear-gradient(135deg,#fff3e6,#ffe9f0);border:1px solid #ffe0c2}
  .summary .box.balance-box .val{color:#e8822e;font-size:18px}
  .summary .box.balance-box.neg .val{color:var(--red)}
  .balance-sub{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.2}
  .expense-open{display:block;width:100%;text-align:center;margin-top:12px;background:transparent;color:var(--red);font-size:14px;font-weight:700;padding:10px;border:1px dashed #f3c0bc;border-radius:12px}
  /* 支出弹窗 */
  .modal{position:fixed;inset:0;background:rgba(48,43,66,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal-card{width:100%;max-width:520px;max-height:86vh;background:#fff;border-radius:20px;display:flex;flex-direction:column;overflow:hidden;animation:pop .2s ease}
  @keyframes pop{from{transform:scale(.96);opacity:.5}to{transform:scale(1);opacity:1}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line)}
  .modal-head h3{margin:0;font-size:16px}
  .modal-close{background:transparent;color:var(--muted);font-size:26px;line-height:1;padding:0 6px;font-weight:700}
  .modal-body{padding:16px;overflow:auto}
  .modal-body .expense-form{margin:0 0 16px;padding:0;border:0;background:transparent}
  .modal-body .expense-list-wrap h4{font-size:14px;margin:0 0 8px;color:var(--ink)}
  .expense-row{display:flex;gap:8px;margin-bottom:8px}
  .expense-row input{flex:1;width:auto;padding:11px;border:1px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;box-sizing:border-box;margin:0;text-align:left}
  .expense-row input[type=number]{max-width:130px}
  .expense-actions{display:flex;gap:8px;align-items:center}
  .expense-actions .btn-primary{flex:0 0 auto;width:auto;padding:11px 18px}
  .expense-item{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line);font-size:14px}
  .expense-item:last-child{border-bottom:0}
  .expense-item .name{font-weight:600}
  .expense-item .amt{color:var(--red);font-weight:800;font-size:15px;white-space:nowrap}
  .expense-item .time{color:var(--muted);font-size:11px}
  .expense-item .del{background:transparent;color:var(--muted);font-size:12px;padding:4px 8px}
  @media(max-width:480px){
    .page{padding:14px 0 40px}
    h1{font-size:18px}
    .summary .val{font-size:18px}
    .complete-btn{padding:13px}
  }
</style>
</head>
<body>
<div id="loginScreen">
  <div class="card">
    <div class="emoji">🧹</div>
    <h2>家务打卡乐园</h2>
    <p>请输入你的姓名和验证码</p>
    <input id="loginName" placeholder="姓名" autocomplete="name">
    <input id="loginPwd" inputmode="numeric" maxlength="6" placeholder="验证码（问家长要）" style="letter-spacing:3px">
    <button class="btn-primary" id="loginBtn" onclick="doLogin()">登录</button>
    <p id="loginError"></p>
    <p style="margin-top:16px"><a class="link-btn" href="每日打卡.html">← 回到学习打卡</a></p>
  </div>
</div>

<div class="page" id="mainApp" style="display:none">
  <div class="topbar">
    <div class="who">👋 <b id="welcomeName"></b> 的家务</div>
    <div class="acts">
      <button class="link-btn" onclick="location.href='每日打卡.html'">学习打卡</button>
      <button class="link-btn danger" onclick="doLogout()">退出</button>
    </div>
  </div>
  <div class="card-box">
    <h3>💰 我的存钱罐</h3>
    <div class="summary">
      <div class="box"><div class="label">今日收入</div><div class="val" id="sumToday">¥0</div></div>
      <div class="box"><div class="label">本周收入</div><div class="val" id="sumWeek">¥0</div></div>
      <div class="box"><div class="label">累计收入</div><div class="val" id="sumTotal">¥0</div></div>
      <div class="box balance-box" id="balanceBox"><div class="label">余额</div><div class="val" id="balanceVal">¥0</div><div class="balance-sub" id="balanceSub"></div></div>
    </div>
    <button class="expense-open" type="button" onclick="openExpenseModal()">💸 支出录入 / 查看明细</button>
  </div>
  <div class="card-box">
    <h3>✅ 完成家务</h3>
    <div class="date-row">
      <label>日期</label>
      <input type="date" id="choreDate">
    </div>
    <p class="sub" style="margin:4px 0 12px">忘记打卡了？可以选过去的日期补打哦～</p>
    <div class="task-list" id="taskList"><div class="empty">加载中…</div></div>
    <button class="complete-btn" id="completeBtn" onclick="completeChore()"><span id="btnLabel">完成选中</span> +<span id="btnAmt"></span></button>
    <div class="msg" id="choreMsg"></div>
  </div>

  <div class="card-box">
    <h3 id="logTitle">📋 今日记录</h3>
    <div id="todayList"><div class="empty">今天还没有完成家务哦</div></div>
  </div>

  <!-- 支出弹窗 -->
  <div class="modal" id="expenseModal" style="display:none" onclick="if(event.target===this)closeExpenseModal()">
    <div class="modal-card">
      <div class="modal-head">
        <h3>💸 支出</h3>
        <button class="modal-close" type="button" onclick="closeExpenseModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="expense-form">
          <div class="date-row">
            <label>支出日期</label>
            <input type="date" id="expenseDate">
          </div>
          <div class="expense-row">
            <input type="number" id="expenseAmt" placeholder="金额（元）" min="0.01" max="9999" step="0.01" inputmode="decimal">
            <input type="text" id="expenseNote" placeholder="买了什么？（选填）" maxlength="50">
          </div>
          <div class="expense-actions">
            <button class="btn-primary" type="button" onclick="submitExpense()">保存支出</button>
          </div>
          <div class="msg" id="expenseMsg"></div>
        </div>
        <div class="expense-list-wrap">
          <h4 id="expenseLogTitle">支出记录</h4>
          <div id="expenseList"><div class="empty">今天还没有支出记录</div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="cloud-config.js?v=2.0.1"></script>
<script src="cloud-sync.js?v=3.5.0"></script>
<script>
  const $ = (id) => document.getElementById(id);
  function fmtMoney(n){ n = Number(n)||0; return '¥' + (Number.isInteger(n) ? n : n.toFixed(2)); }
  function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function weekMonday(){ const x=new Date(); x.setHours(0,0,0,0); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
  function setChoreDate(d){ const el=$('choreDate'); if(el) el.value=d; }
  function getChoreDate(){ const v=$('choreDate').value; const today=todayStr(); return (v && v<=today)?v:today; }

  async function doLogin(){
    const btn=$('loginBtn'); btn.disabled=true; btn.textContent='登录中…'; $('loginError').textContent='';
    try{
      const name=$('loginName').value.trim(), code=$('loginPwd').value.trim();
      if(!name||!code) throw new Error('请输入姓名和验证码。');
      await window.SummerCloud.childLogin(name, code);
      $('loginScreen').style.display='none'; $('mainApp').style.display='block';
      await loadData();
    }catch(e){ $('loginError').textContent=e.message||'登录失败，请重试。'; }
    finally{ btn.disabled=false; btn.textContent='登录'; }
  }
  function doLogout(){
    window.SummerCloud.childLogout();
    location.reload();
  }

  let LOGS = [];
  let EXPENSES = [];
  let TASKS = [];
  async function loadData(){
    const me = window.SummerCloud.getChildSession();
    $('welcomeName').textContent = me?.childName || '我';
    setChoreDate(todayStr());
    const dateEl = $('choreDate');
    if(dateEl){ dateEl.max = todayStr(); dateEl.addEventListener('change', ()=>{ renderLogList(); renderExpenseList(); }); }
    try{
      const res = await window.SummerCloud.getChoreTasksPublic();
      TASKS = res.tasks || [];
    }catch(e){ TASKS = []; }
    renderTaskOptions();
    // 拉取最近 120 天记录用于汇总
    try{
      const r = await window.SummerCloud.listChoreLogs({ days: 120 });
      LOGS = r.logs || [];
    }catch(e){ LOGS = []; }
    try{
      const r2 = await window.SummerCloud.listChoreExpenses({ days: 120 });
      EXPENSES = r2.expenses || [];
    }catch(e){ EXPENSES = []; }
    render();
  }

  function renderTaskOptions(){
    const list=$('taskList');
    if(!TASKS.length){
      list.innerHTML='<div class="empty">家长还没配置家务任务</div>';
      $('completeBtn').disabled=true;
      $('btnAmt').textContent='';
      return;
    }
    list.innerHTML = TASKS.map((t,i)=>`<div class="task-item" data-i="${i}">
      <input type="checkbox" value="${escapeHtml(t.id)}" data-amount="${t.amount}">
      <span class="tname">${escapeHtml(t.name)}</span>
      <span class="tamt">${fmtMoney(t.amount)}/次</span>
      <span class="qty-ctrl">
        <button type="button" onclick="stepQty(${i},-1)">−</button>
        <input type="number" min="1" max="1000" value="1" inputmode="numeric" data-qty>
        <button type="button" onclick="stepQty(${i},1)">＋</button>
      </span>
    </div>`).join('');
    $('completeBtn').disabled=false;
    syncBtnAmt();
    list.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener('change', syncBtnAmt));
    list.querySelectorAll('input[data-qty]').forEach(inp=>inp.addEventListener('input', syncBtnAmt));
  }
  function stepQty(i, d){
    const row=document.querySelector(`#taskList .task-item[data-i="${i}"]`);
    if(!row) return;
    const inp=row.querySelector('input[data-qty]');
    let v=Math.max(1, Math.min(1000, (parseInt(inp.value,10)||1)+d));
    inp.value=v;
    syncBtnAmt();
  }
  function selectedTasks(){
    return Array.from(document.querySelectorAll('#taskList .task-item')).filter(row=>row.querySelector('input[type=checkbox]').checked).map(row=>{
      const cb=row.querySelector('input[type=checkbox]');
      const t = TASKS.find(x=>x.id===cb.value);
      const qty=Math.max(1, parseInt(row.querySelector('input[data-qty]').value,10)||1);
      return t ? { id:t.id, name:t.name, amount:Number(cb.dataset.amount)||0, qty } : null;
    }).filter(Boolean);
  }
  function syncBtnAmt(){
    const sel = selectedTasks();
    const total = sel.reduce((s,t)=>s+ t.amount*t.qty,0);
    const cnt = sel.reduce((s,t)=>s+t.qty,0);
    $('btnAmt').textContent = sel.length ? fmtMoney(total) : '';
    $('btnLabel').textContent = sel.length ? `完成选中（${cnt} 次）` : '完成选中';
  }

  async function completeChore(){
    const sel = selectedTasks();
    if(!sel.length){ $('choreMsg').className='msg err'; $('choreMsg').textContent='请先勾选要完成的家务。'; return; }
    const total = sel.reduce((s,t)=>s+ t.amount*t.qty,0);
    const logDate = getChoreDate();
    const btn=$('completeBtn'); btn.disabled=true;
    try{
      for(const t of sel){
        await window.SummerCloud.addChoreLog({ taskId:t.id, taskName:t.name, amount:t.amount, qty:t.qty, logDate, note:'' });
      }
      $('choreMsg').className='msg ok'; $('choreMsg').textContent=`完成 ${sel.reduce((s,t)=>s+t.qty,0)} 次家务，共奖励 ${fmtMoney(total)} 已记下！🎉`;
      // 清空勾选、次数归 1
      document.querySelectorAll('#taskList .task-item').forEach(row=>{
        row.querySelector('input[type=checkbox]').checked=false;
        row.querySelector('input[data-qty]').value=1;
      });
      syncBtnAmt();
      // 刷新记录与汇总
      const r = await window.SummerCloud.listChoreLogs({ days: 120 });
      LOGS = r.logs||[];
      render();
    }catch(e){ $('choreMsg').className='msg err'; $('choreMsg').textContent=e.message||'记录失败，请重试。'; }
    finally{ btn.disabled=false; }
  }

  function render(){
    const wk=weekMonday();
    const sumToday = LOGS.filter(l=>l.log_date===todayStr()).reduce((s,l)=>s+Number(l.amount),0);
    const sumWeek  = LOGS.filter(l=>l.log_date>=wk).reduce((s,l)=>s+Number(l.amount),0);
    const sumTotal = LOGS.reduce((s,l)=>s+Number(l.amount),0);
    $('sumToday').textContent=fmtMoney(sumToday);
    $('sumWeek').textContent=fmtMoney(sumWeek);
    $('sumTotal').textContent=fmtMoney(sumTotal);
    const expTotal = EXPENSES.reduce((s,e)=>s+Number(e.amount),0);
    const balance = sumTotal - expTotal;
    $('balanceVal').textContent = (balance<0 ? '−' : '') + fmtMoney(Math.abs(balance));
    $('balanceSub').textContent = expTotal>0 ? `已支出 ${fmtMoney(expTotal)}` : '';
    $('balanceBox').classList.toggle('neg', balance<0);
    renderLogList();
    renderExpenseList();
  }

  function renderLogList(){
    const selDate = getChoreDate();
    const today = todayStr();
    const list=$('todayList');
    const title=$('logTitle');
    const isToday = selDate === today;
    title.textContent = isToday ? '📋 今日记录' : `📋 ${selDate} 记录`;
    const dayLogs = LOGS.filter(l=>l.log_date===selDate);
    if(!dayLogs.length){ list.innerHTML= isToday ? '<div class="empty">今天还没有完成家务哦</div>' : `<div class="empty">${selDate} 暂无记录</div>`; return; }
    const sorted=[...dayLogs].sort((a,b)=> (b.created_at||'').localeCompare(a.created_at||''));
    list.innerHTML = sorted.map(l=>`<div class="log-item"><div><div class="name">${escapeHtml(l.task_name)}${(l.qty&&l.qty>1)?` <span class="time">×${l.qty}次</span>`:''}</div><div class="time">${fmtTime(l.created_at)}${l.note?(' · '+escapeHtml(l.note)):''}</div></div><div class="amt">+${fmtMoney(l.amount)}</div></div>`).join('');
  }
  function renderExpenseList(){
    const selDate = getChoreDate();
    const today = todayStr();
    const list=$('expenseList');
    const title=$('expenseLogTitle');
    const isToday = selDate === today;
    title.textContent = isToday ? '💸 支出记录' : `💸 ${selDate} 支出`;
    const dayExp = EXPENSES.filter(e=>e.spent_date===selDate);
    if(!dayExp.length){ list.innerHTML= isToday ? '<div class="empty">今天还没有支出记录</div>' : `<div class="empty">${selDate} 暂无支出</div>`; return; }
    const sorted=[...dayExp].sort((a,b)=> (b.created_at||'').localeCompare(a.created_at||''));
    list.innerHTML = sorted.map(e=>`<div class="expense-item"><div><div class="name">${escapeHtml(e.note||'支出')}</div><div class="time">${fmtTime(e.created_at)}</div></div><div style="display:flex;align-items:center;gap:10px"><div class="amt">−${fmtMoney(e.amount)}</div><button class="del" type="button" onclick="deleteExpense('${e.id}')">删除</button></div></div>`).join('');
  }
  function openExpenseModal(){
    $('expenseModal').style.display='flex';
    $('expenseDate').value=getChoreDate();
    $('expenseMsg').textContent='';
    $('expenseAmt').value=''; $('expenseNote').value='';
    renderExpenseList();
  }
  function closeExpenseModal(){ $('expenseModal').style.display='none'; }
  async function submitExpense(){
    const amt=Math.round(Number($('expenseAmt').value)*100)/100;
    const note=$('expenseNote').value.trim();
    const date=$('expenseDate').value || getChoreDate();
    const msg=$('expenseMsg');
    if(!(amt>0)){ msg.className='msg err'; msg.textContent='请输入大于 0 的金额。'; return; }
    if(date>todayStr()){ msg.className='msg err'; msg.textContent='支出日期不能晚于今天。'; return; }
    msg.className='msg'; msg.textContent='保存中…';
    try{
      await window.SummerCloud.addChoreExpense({ amount:amt, note, spentDate:date });
      msg.className='msg ok'; msg.textContent=`已记录支出 ${fmtMoney(amt)}${note?('：'+note):''} 💸`;
      $('expenseAmt').value=''; $('expenseNote').value='';
      const r = await window.SummerCloud.listChoreExpenses({ days: 120 });
      EXPENSES = r.expenses||[];
      render();
    }catch(e){ msg.className='msg err'; msg.textContent=e.message||'记录失败，请重试。'; }
  }
  async function deleteExpense(id){
    if(!confirm('确认删除这条支出记录吗？')) return;
    try{
      await window.SummerCloud.deleteChoreExpense(id);
      const r = await window.SummerCloud.listChoreExpenses({ days: 120 });
      EXPENSES = r.expenses||[];
      render();
    }catch(e){ alert(e.message||'删除失败'); }
  }
  function fmtTime(iso){ if(!iso) return ''; const d=new Date(iso); return d.toTimeString().slice(0,5); }
  function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // 启动时若已有登录态则直接进入
  (async()=>{
    const me = window.SummerCloud.getChildSession();
    if(me && me.childId){
      $('loginScreen').style.display='none'; $('mainApp').style.display='block';
      try{ await window.SummerCloud.ensureAnonymousSession(); }catch(_){}
      await loadData();
    }
  })();
</script>
</body>
</html>

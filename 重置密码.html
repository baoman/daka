<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重置密码 · 暑假学习打卡</title>
<style>
:root{--ink:#302b42;--muted:#7d7691;--line:#e7e1ee;--violet:#6c63ff;--bg:#fbf9fd;--red:#b42318;--green:#2e8a57}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}h1{font-size:24px;margin:0 0 8px}p{font-size:13px;line-height:1.7;color:var(--muted);margin:0}.form{display:grid;gap:10px;margin-top:20px}label{font-size:12px;color:var(--muted)}input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;color:var(--ink)}button{border:0;border-radius:10px;padding:11px 14px;background:var(--violet);color:#fff;font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.status{min-height:22px;font-size:13px;line-height:1.6;color:var(--muted)}.status.error{color:var(--red)}.status.success{color:var(--green)}a{color:#5149c9;font-size:13px;text-decoration:none}
</style>
</head>
<body>
<main class="card">
<h1>设置新密码</h1>
<p id="intro">请设置新的家庭账号密码，然后返回家长查看页登录。</p>
<div class="form" id="resetForm" hidden>
<label for="newPassword">新密码</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="至少 8 位">
<label for="confirmPassword">确认新密码</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="再次输入新密码">
<button type="button" id="submitBtn" onclick="savePassword()">保存新密码</button>
</div>
<div class="status" id="status">正在验证重置链接…</div>
<p><a href="家长查看.html">返回家长查看</a></p>
</main>
<script src="cloud-config.js?v=1.6.0"></script><script src="cloud-sync.js?v=1.6.0"></script>
<script>
let recoveryReady=false;
function setStatus(message,type=''){const node=document.getElementById('status');node.textContent=message;node.className=`status ${type}`}
async function init(){if(!window.SummerCloud||!SummerCloud.isConfigured()){setStatus('云端配置缺失。','error');return}try{const session=await SummerCloud.getSession();if(!session){setStatus('重置链接无效或已过期。请返回家长查看页重新发送重置邮件。','error');return}recoveryReady=true;document.getElementById('resetForm').hidden=false;setStatus('链接验证成功，请设置新密码。')}catch(e){setStatus('重置链接无效或已过期。请重新发送重置邮件。','error')}}
async function savePassword(){const password=document.getElementById('newPassword').value,confirm=document.getElementById('confirmPassword').value,button=document.getElementById('submitBtn');if(password.length<8){setStatus('新密码至少需要 8 位。','error');return}if(password!==confirm){setStatus('两次输入的新密码不一致。','error');return}if(!recoveryReady){setStatus('重置链接无效或已过期，请重新发送邮件。','error');return}button.disabled=true;setStatus('正在保存新密码…');try{await SummerCloud.updatePassword(password);document.getElementById('resetForm').hidden=true;document.getElementById('intro').textContent='新密码已设置完成。请返回家长查看页，用新密码登录。';setStatus('密码重置成功。','success')}catch(e){setStatus(e.message||'密码保存失败，请重新打开最新的重置邮件。','error');button.disabled=false}}
init();
</script>
</body>
</html>

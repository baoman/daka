<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>全部卡片预览</title>
  <style>
    :root {
      --bg: linear-gradient(180deg, #fffaff 0%, #fff7fd 52%, #f7fbff 100%);
      --panel: rgba(255,255,255,.92);
      --text: #4a3a66;
      --sub: #7c6f95;
      --border: rgba(170,145,243,.16);
      --shadow: 0 18px 40px rgba(136, 98, 210, .12);
      --r: #5c9dff;
      --sr: #9a63ff;
      --ssr: #f0bb3d;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    body.overlay-open {
      overflow: hidden;
    }

    .shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 20px 40px;
      overflow-x: clip;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .hero-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 30px;
      font-weight: 900;
    }

    .hero-icon {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffe4f1, #eaf5ff);
      box-shadow: 0 12px 24px rgba(150, 112, 228, .14);
    }

    .hero-sub {
      margin-top: 8px;
      max-width: 760px;
      color: var(--sub);
      font-size: 14px;
      line-height: 1.8;
    }

    .hero-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .action-btn {
      border: none;
      text-decoration: none;
      border-radius: 14px;
      padding: 11px 16px;
      font-size: 13px;
      font-weight: 900;
      color: var(--text);
      background: rgba(255,255,255,.92);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .summary-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .summary-card .k {
      font-size: 12px;
      color: var(--sub);
      font-weight: 800;
    }

    .summary-card .v {
      margin-top: 6px;
      font-size: 26px;
      font-weight: 900;
      line-height: 1.1;
    }

    .summary-card .t {
      margin-top: 6px;
      font-size: 12px;
      color: var(--sub);
      line-height: 1.7;
    }

    .board {
      display: grid;
      gap: 20px;
    }

    .group {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .group-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .group-head h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      font-size: 20px;
      font-weight: 900;
    }

    .rarity-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      color: white;
      font-size: 12px;
      font-weight: 900;
      min-width: 48px;
    }

    .rarity-pill.r { background: linear-gradient(135deg, var(--r), #3c7af1); }
    .rarity-pill.sr { background: linear-gradient(135deg, var(--sr), #7f42df); }
    .rarity-pill.pr { background: linear-gradient(135deg, #6e5ce7, #4834d4); }
    .rarity-pill.ssr { background: linear-gradient(135deg, var(--ssr), #d59300); }
    .rarity-pill.hr { background: linear-gradient(135deg, #9b59b6, #6c3483); }
    .rarity-pill.ur { background: linear-gradient(135deg, #5b2c8e, #2c0e5e); }
    .rarity-pill.cp { background: linear-gradient(135deg, #e74c3c, #f39c12, #2ecc71, #3498db); }
    .rarity-pill.lgr { background: linear-gradient(135deg, #f5a623, #d4880f); }
    .rarity-pill.sp { background: linear-gradient(135deg, #e74c3c, #d35400); }
    .rarity-pill.gp { background: linear-gradient(135deg, #c9983a, #8b6914); }

    .group-meta {
      color: var(--sub);
      font-size: 12px;
      font-weight: 800;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(214px, 1fr));
      gap: 16px;
    }

    .catalog-tile {
      display: grid;
      gap: 10px;
    }

    .egg-card {
      position: relative;
      width: 100%;
      max-width: 214px;
      aspect-ratio: 63 / 88;
      margin: 0 auto;
      border-radius: 24px;
      padding: 5px;
      background: linear-gradient(145deg, rgba(255,255,255,.78), rgba(255,255,255,.2));
      transition: transform .18s ease, filter .18s ease;
      overflow: hidden;
    }

    .egg-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(120deg, rgba(255,255,255,0) 12%, rgba(255,255,255,.34) 44%, rgba(255,255,255,0) 76%);
      transform: translateX(-130%);
      pointer-events: none;
      opacity: .9;
    }

    .egg-card:hover {
      transform: translateY(-4px) scale(1.01);
      filter: drop-shadow(0 18px 28px rgba(136, 98, 210, .18));
    }

    .egg-card:hover::before { animation: cardSweep 1s ease forwards; }

    @media (hover: none) and (pointer: coarse), (max-width: 1024px) {
      .egg-card:hover {
        transform: none;
        filter: none;
      }

      .egg-card:hover::before {
        animation: none;
      }

      .egg-card.ssr:hover {
        box-shadow: inset 0 0 0 2px rgba(243,190,68,.9),
                    0 0 20px 5px rgba(243,190,68,.4),
                    0 12px 20px rgba(227, 170, 30, .2);
      }

      .egg-card.ssr:hover .egg-card-front.ssr::after {
        animation-duration: 5s;
        opacity: .65;
      }
    }

    @keyframes cardSweep {
      0% { transform: translateX(-130%); }
      100% { transform: translateX(135%); }
    }

    @keyframes holoFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .egg-card.r { box-shadow: inset 0 0 0 2px rgba(95,168,255,.78), 0 10px 18px rgba(95,168,255,.12); }
    .egg-card.sr { box-shadow: inset 0 0 0 2px rgba(155,99,255,.82), 0 10px 18px rgba(155,99,255,.14); }
    .egg-card.ssr {
      box-shadow: inset 0 0 0 2px rgba(243,190,68,.9), 
                  0 0 20px 5px rgba(243,190,68,.4), 
                  0 12px 20px rgba(227, 170, 30, .2);
    }

    .egg-card.ssr::before {
      background: linear-gradient(
        120deg,
        rgba(255, 255, 255, 0) 10%,
        rgba(255, 240, 180, 0.6) 40%,
        rgba(255, 255, 255, 0.8) 50%,
        rgba(255, 240, 180, 0.6) 60%,
        rgba(255, 255, 255, 0) 90%
      );
      width: 150%;
      animation: cardSweep 3s ease-in-out infinite;
    }

    .egg-card.ssr:hover {
      box-shadow: inset 0 0 0 2px rgba(255, 215, 0, 1),
                  0 0 30px 10px rgba(243, 190, 68, 0.6),
                  0 18px 28px rgba(227, 170, 30, 0.4);
    }

    .egg-card.ssr:hover .egg-card-front.ssr::after {
      animation-duration: 2s;
      opacity: 0.8;
    }

    .egg-card-inner {
      height: 100%;
      border-radius: 21px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255,255,255,.97), rgba(255,255,255,.84));
    }

    .egg-card-front {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      padding: 6px 7px 12px;
      position: relative;
      cursor: pointer;
    }

    .egg-card-front::before {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 17px;
      border: 1px solid rgba(255,255,255,.28);
      pointer-events: none;
    }

    .egg-card-front::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.26), transparent 48%, rgba(255,255,255,.08));
      pointer-events: none;
    }

    .egg-card-front.ssr::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(
        135deg,
        rgba(255, 0, 0, 0.15),
        rgba(255, 165, 0, 0.15),
        rgba(255, 255, 0, 0.15),
        rgba(0, 128, 0, 0.15),
        rgba(0, 0, 255, 0.15),
        rgba(75, 0, 130, 0.15),
        rgba(238, 130, 238, 0.15)
      );
      background-size: 300% 300%;
      animation: holoFlow 5s linear infinite;
      mix-blend-mode: color-dodge;
      pointer-events: none;
      z-index: 2;
    }

    .egg-card-front.sr::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.4) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      background-size: 200% 200%;
      animation: holoFlow 8s linear infinite;
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: 2;
    }

    .egg-card-front.r { background: linear-gradient(180deg, rgba(224,241,255,.66), rgba(255,255,255,.78)); }
    .egg-card-front.sr { background: linear-gradient(180deg, rgba(241,228,255,.72), rgba(255,255,255,.8)); }
    .egg-card-front.ssr {
      background:
        radial-gradient(circle at 16% 16%, rgba(255,255,255,.46), transparent 26%),
        linear-gradient(180deg, rgba(255,241,198,.84), rgba(255,255,255,.82));
    }

    .card-back-face {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }

    .card-back-face.r {
      --back-ring-size: 116px;
      --back-ring-border: 2px solid rgba(255,255,255,.52);
      --back-ring-shadow: 0 0 0 8px rgba(255,255,255,.1), 0 0 0 16px rgba(255,255,255,.05);
      --back-frame-border: 1px solid rgba(255,255,255,.34);
      --back-frame-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
      --back-corner-border: 1px solid rgba(255,255,255,.34);
      --back-corner-shadow: none;
      --back-corner-opacity: .5;
      --back-mark-color: #ffffff;
      --back-mark-scale: 1;
      --back-mark-shadow: 0 10px 18px rgba(83, 120, 185, .16);
      --back-note-bg: rgba(255,255,255,.18);
      --back-note-shadow: inset 0 0 0 1px rgba(255,255,255,.24);
      background:
        radial-gradient(circle at 50% 34%, rgba(255,255,255,.16), transparent 34%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 16px),
        linear-gradient(145deg, #dfefff 0%, #7fb4ff 56%, #ebf7ff 100%);
    }

    .card-back-face.sr {
      --back-ring-size: 122px;
      --back-ring-border: 2px solid rgba(255,255,255,.68);
      --back-ring-shadow: 0 0 0 8px rgba(255,255,255,.12), 0 0 0 18px rgba(171,140,255,.12);
      --back-frame-border: 1px solid rgba(255,255,255,.46);
      --back-frame-shadow: inset 0 0 0 1px rgba(255,255,255,.1), inset 0 0 0 8px rgba(255,255,255,.03);
      --back-corner-border: 1px solid rgba(255,255,255,.48);
      --back-corner-shadow: 0 0 0 1px rgba(255,255,255,.08) inset;
      --back-corner-opacity: .62;
      --back-mark-color: #ffffff;
      --back-mark-scale: 1;
      --back-mark-shadow: 0 0 16px rgba(255,255,255,.24), 0 10px 18px rgba(116,73,191,.2);
      --back-note-bg: linear-gradient(135deg, rgba(255,255,255,.24), rgba(255,255,255,.12));
      --back-note-shadow: inset 0 0 0 1px rgba(255,255,255,.28), 0 8px 18px rgba(118,81,197,.14);
      background:
        radial-gradient(circle at 50% 33%, rgba(255,255,255,.24), transparent 34%),
        linear-gradient(135deg, rgba(255,255,255,.16), transparent 28%, rgba(255,255,255,.08) 52%, transparent 72%),
        repeating-linear-gradient(45deg, rgba(255,255,255,.18) 0 1px, transparent 1px 12px),
        repeating-linear-gradient(-45deg, rgba(255,255,255,.08) 0 1px, transparent 1px 18px),
        linear-gradient(145deg, #f2e4ff 0%, #9b63ff 42%, #7d58e7 64%, #eef6ff 100%);
    }

    .card-back-face.ssr {
      --back-ring-size: 128px;
      --back-ring-border: 2px solid rgba(255,249,225,.8);
      --back-ring-shadow: 0 0 0 8px rgba(255,250,226,.16), 0 0 0 18px rgba(255,232,165,.14), 0 0 32px rgba(243,190,68,.16);
      --back-frame-border: 1px solid rgba(255,246,217,.62);
      --back-frame-shadow: inset 0 0 0 1px rgba(255,255,255,.12), inset 0 0 0 10px rgba(255,241,196,.04);
      --back-corner-border: 1px solid rgba(255,244,209,.72);
      --back-corner-shadow: 0 0 0 1px rgba(255,236,181,.16) inset, 0 0 18px rgba(255,221,132,.12);
      --back-corner-opacity: .78;
      --back-mark-color: #fff9ea;
      --back-mark-scale: 1.05;
      --back-mark-shadow: 0 0 18px rgba(255,244,204,.42), 0 10px 18px rgba(173,118,12,.18);
      --back-note-bg: linear-gradient(135deg, rgba(255,249,228,.34), rgba(255,255,255,.18));
      --back-note-shadow: inset 0 0 0 1px rgba(255,246,215,.4), 0 10px 20px rgba(184,123,8,.16);
      background:
        radial-gradient(circle at 50% 31%, rgba(255,255,255,.3), transparent 35%),
        repeating-conic-gradient(from -6deg at 50% 50%, rgba(255,247,213,.24) 0deg 6deg, transparent 6deg 18deg),
        repeating-linear-gradient(0deg, rgba(255,255,255,.16) 0 1px, transparent 1px 14px),
        repeating-linear-gradient(90deg, rgba(255,243,208,.14) 0 1px, transparent 1px 14px),
        linear-gradient(145deg, #fff6de 0%, #f7d46e 32%, #f1bd42 54%, #ffe4f0 82%, #fffbf3 100%);
    }

    .card-back-face::before {
      content: "";
      position: absolute;
      width: var(--back-ring-size, 118px);
      height: var(--back-ring-size, 118px);
      border-radius: 50%;
      border: var(--back-ring-border, 2px solid rgba(255,255,255,.56));
      background: radial-gradient(circle, rgba(255,255,255,.08), transparent 68%);
      box-shadow: var(--back-ring-shadow, 0 0 0 10px rgba(255,255,255,.12), 0 0 0 18px rgba(255,255,255,.08));
    }

    .card-back-face::after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 14px;
      border: var(--back-frame-border, 1px solid rgba(255,255,255,.34));
      box-shadow: var(--back-frame-shadow, inset 0 0 0 1px rgba(255,255,255,.08));
    }

    .back-corner {
      position: absolute;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: var(--back-corner-border, 1px solid rgba(255,255,255,.34));
      box-shadow: var(--back-corner-shadow, none);
      transform: rotate(45deg);
      opacity: var(--back-corner-opacity, .5);
    }

    .back-center .mark {
      display: inline-block;
      font-size: 34px;
      line-height: 1;
      color: var(--back-mark-color, #fff);
      transform: scale(var(--back-mark-scale, 1));
      text-shadow: var(--back-mark-shadow, 0 10px 18px rgba(116, 73, 191, .18));
    }

    .back-center .unlock-note {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 26px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--back-note-bg, rgba(255,255,255,.18));
      box-shadow: var(--back-note-shadow, inset 0 0 0 1px rgba(255,255,255,.24));
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .4px;
      white-space: nowrap;
    }

    .card-topline {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 8px;
      position: relative;
      z-index: 1;
    }

    .card-name {
      font-size: 13px;
      font-weight: 900;
      line-height: 1.35;
      text-shadow: 0 1px 0 rgba(255,255,255,.5);
    }

    .card-number {
      margin-top: 3px;
      font-size: 10px;
      color: rgba(75,63,102,.56);
      letter-spacing: .8px;
      font-weight: 900;
    }

    .rarity-badge {
      min-width: 42px;
      height: 24px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 11px;
      font-weight: 900;
      box-shadow: 0 6px 12px rgba(112, 80, 189, .15);
    }

    .rarity-badge.r { background: linear-gradient(135deg, var(--r), #3c7af1); }
  .rarity-badge.sr { background: linear-gradient(135deg, var(--sr), #7f42df); }
  .rarity-badge.ssr { background: linear-gradient(135deg, var(--ssr), #d59300); }
  .rarity-badge.pr { background: linear-gradient(135deg, #e84a9c, #ff85b8); color: #fff; }
  .rarity-badge.hr { background: linear-gradient(135deg, #a02acc, #cc66ee); }
  .rarity-badge.ur { background: linear-gradient(135deg, #502888, #aa66ee); }
  .rarity-badge.cp { background: linear-gradient(135deg, #cc4499, #ee66bb); }
  .rarity-badge.lgr { background: linear-gradient(135deg, #c89200, #f0c850); }
  .rarity-badge.sp { background: linear-gradient(135deg, #cc3300, #ff6644); }
  .rarity-badge.gp { background: linear-gradient(135deg, #996600, #cc9900); }

    .card-art {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 190px;
      margin: 0 0 2px;
      position: relative;
      z-index: 1;
    }

    .card-art::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.52), rgba(255,255,255,0) 74%);
    }

    .card-art svg,
    .card-art img {
      width: 180px;
      height: 180px;
      border-radius: 18px;
      object-fit: cover;
      display: block;
      filter: drop-shadow(0 12px 18px rgba(117, 76, 188, .18));
      position: relative;
      z-index: 1;
    }

    .egg-card-face {
      width: 180px; height: 180px; border-radius: 18px; position: relative;
      overflow: hidden; display: flex; flex-direction: column; align-items: center;
      z-index: 1; filter: drop-shadow(0 10px 16px rgba(117,76,188,.14));
    }
    .card-badge { position: absolute; top: 8px; left: 8px; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 8px; z-index: 2; }
    .badge-r { background: rgba(92,157,255,.18); color: #3a7bd5; }
    .badge-sr { background: rgba(155,99,255,.2); color: #7a40dc; }
    .badge-pr { background: rgba(0,180,160,.2); color: #0a9080; }
    .badge-ssr { background: rgba(243,190,68,.28); color: #a66f00; }
    .badge-hr { background: rgba(160,50,200,.25); color: #9032c0; }
    .badge-ur { background: rgba(80,40,140,.3); color: #aa66ee; }
    .badge-cp { background: rgba(220,80,180,.25); color: #cc4499; }
    .badge-lgr { background: rgba(200,150,0,.3); color: #997700; }
    .badge-sp { background: rgba(220,60,30,.28); color: #cc3300; }
    .badge-gp { background: rgba(180,130,0,.32); color: #996600; }
    .card-sr-shine { position: absolute; top: -20px; right: -20px; width: 60px; height: 60px; background: radial-gradient(circle,rgba(255,255,255,.4) 0%,transparent 70%); border-radius: 50%; animation: srPulse 2s ease-in-out infinite; }
    .card-ssr-shine { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg,rgba(255,215,0,0) 40%,rgba(255,215,0,.15) 50%,rgba(255,215,0,0) 60%); background-size:300% 300%; animation: ssrShine 3s ease-in-out infinite; pointer-events: none; z-index: 1; }
    .card-hr-shine { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg,rgba(160,50,200,0) 40%,rgba(160,50,200,.12) 50%,rgba(160,50,200,0) 60%); background-size:300% 300%; animation: ssrShine 2.5s ease-in-out infinite; pointer-events: none; z-index: 1; }
    .card-ur-shine { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg,rgba(120,60,200,0) 35%,rgba(120,60,200,.18) 50%,rgba(120,60,200,0) 65%); background-size:400% 400%; animation: urShine 4s ease-in-out infinite; pointer-events: none; z-index: 1; }
    .card-cp-shine { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: conic-gradient(from 0deg,transparent,rgba(255,100,200,.15),transparent,rgba(100,200,255,.15),transparent); background-size:200% 200%; animation: cpSpin 6s linear infinite; pointer-events: none; z-index: 1; }
    .card-lgr-shine { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg,rgba(218,165,32,0) 30%,rgba(218,165,32,.2) 50%,rgba(218,165,32,0) 70%); background-size:300% 300%; animation: lgrPulse 3s ease-in-out infinite; pointer-events: none; z-index: 1; }
    .card-sp-shine { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(45deg,rgba(255,80,30,0),rgba(255,80,30,.15),rgba(255,200,0,.15),rgba(255,80,30,0)); background-size:400% 400%; animation: spRainbow 5s ease-in-out infinite; pointer-events: none; z-index: 1; }
    .card-gp-shine { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg,rgba(255,215,0,0) 35%,rgba(255,215,0,.22) 50%,rgba(255,215,0,0) 65%); background-size:250% 250%; animation: gpRoyal 2.5s ease-in-out infinite; pointer-events: none; z-index: 1; }
    @keyframes srPulse { 0%,100%{opacity:.6;transform:scale(1)} 50%{opacity:1;transform:scale(1.2)} }
    @keyframes ssrShine { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
    @keyframes urShine { 0%,100%{background-position:0% 0%} 50%{background-position:100% 100%} }
    @keyframes cpSpin { to { transform: rotate(360deg); } }
    @keyframes lgrPulse { 0%,100%{opacity:.5} 50%{opacity:1} }
    @keyframes spRainbow { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
    @keyframes gpRoyal { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }

    .card-footer {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-end;
      position: relative;
      z-index: 1;
      padding-bottom: 2px;
    }

    .card-skill {
      color: var(--sub);
      font-size: 12px;
      line-height: 1.42;
      min-width: 0;
      padding-bottom: 1px;
    }

    .card-series {
      margin-top: 3px;
      font-size: 9px;
      line-height: 1.2;
      letter-spacing: .55px;
      color: rgba(75,63,102,.58);
      font-weight: 800;
    }

    .egg-card.card-context-detail .card-art {
      min-height: 184px;
      margin-bottom: 0;
    }

    .egg-card.card-context-detail .card-footer {
      padding-bottom: 0;
      transform: translateY(-4px);
    }

    .egg-card.card-context-detail .card-series {
      margin-top: 2px;
    }

    .card-count {
      min-width: 30px;
      height: 30px;
      padding: 0 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.88);
      box-shadow: inset 0 0 0 1px rgba(170,145,243,.16);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      color: #6b5a83;
    }

    .note {
      padding: 0 6px;
    }

    .note .name {
      font-size: 14px;
      font-weight: 900;
    }

    .note .desc {
      margin-top: 4px;
      color: var(--sub);
      font-size: 12px;
      line-height: 1.7;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(70, 46, 110, .34);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 60;
      backdrop-filter: blur(8px);
    }

    .modal.show { display: flex; }

    .page-lock-overlay {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(32, 21, 54, .78);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .page-lock-overlay.show {
      display: flex;
    }

    .page-lock-card {
      width: min(440px, 100%);
      background: rgba(255,255,255,.98);
      border: 1px solid rgba(170,145,243,.18);
      border-radius: 24px;
      box-shadow: 0 28px 60px rgba(28, 18, 48, .34);
      padding: 24px 22px 22px;
      text-align: center;
    }

    .page-lock-badge {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 26px;
      background: linear-gradient(135deg, #efe5ff, #e8f4ff);
      box-shadow: 0 10px 22px rgba(125, 89, 205, .18);
    }

    .page-lock-form {
      margin-top: 18px;
      display: grid;
      gap: 10px;
      text-align: left;
    }

    .page-lock-input {
      width: 100%;
      border: 1px solid rgba(170,145,243,.24);
      border-radius: 16px;
      padding: 13px 14px;
      font-size: 16px;
      font-family: inherit;
      color: var(--text);
      background: #fff;
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.5);
    }

    .page-lock-input:focus {
      border-color: rgba(136, 98, 210, .52);
      box-shadow: 0 0 0 4px rgba(136, 98, 210, .12);
    }

    .page-lock-error {
      min-height: 20px;
      font-size: 12px;
      color: #d14c74;
      font-weight: 700;
      padding-left: 2px;
    }

    .page-lock-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .page-lock-btn,
    .page-lock-link {
      min-width: 130px;
      border: none;
      border-radius: 14px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 900;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
    }

    .page-lock-btn {
      color: #fff;
      background: linear-gradient(135deg, #9a63ff, #6d8fff);
      box-shadow: 0 12px 24px rgba(109, 98, 210, .22);
    }

    .page-lock-link {
      color: var(--text);
      background: linear-gradient(135deg, #f8efff, #eef8ff);
      border: 1px solid rgba(170,145,243,.16);
      box-shadow: 0 10px 22px rgba(109, 98, 210, .1);
    }

    .modal-card {
      width: min(980px, 100%);
      background: rgba(255,255,255,.98);
      border: 1px solid rgba(170,145,243,.16);
      border-radius: 24px;
      box-shadow: 0 26px 60px rgba(72, 44, 124, .22);
      overflow: hidden;
    }

    .modal-head {
      padding: 16px 18px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 900;
    }

    .modal-close {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #f8efff, #eef8ff);
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
    }

    .modal-body {
      padding: 14px 18px 18px;
    }

    .card-detail-grid {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 16px;
      align-items: start;
    }

    .detail-headline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .detail-name-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .detail-name {
      font-size: 22px;
      font-weight: 900;
      line-height: 1.2;
      color: var(--text);
    }

    .detail-sub {
      font-size: 13px;
      color: var(--sub);
      line-height: 1.6;
    }

    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .detail-tag {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(156, 124, 255, .1);
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
    }

    .detail-main {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .detail-copy-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .detail-box {
      padding: 12px 13px;
      border-radius: 16px;
      background: linear-gradient(180deg, #fff, #fbf8ff);
      box-shadow: inset 0 0 0 1px rgba(170,145,243,.12);
    }

    .detail-box .k {
      color: var(--sub);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .detail-box .v {
      font-size: 14px;
      line-height: 1.7;
    }

    .detail-box.muted {
      background: linear-gradient(180deg, #fdfbff, #fbf9ff);
      box-shadow: inset 0 0 0 1px rgba(170,145,243,.08);
    }

    .detail-box.muted .k,
    .detail-box.muted .v,
    .detail-box.muted ul {
      color: rgba(90, 76, 126, .78);
    }

    .detail-box ul {
      padding-left: 18px;
      margin: 0;
      color: rgba(90, 76, 126, .78);
      font-size: 13px;
      line-height: 1.7;
    }

    .detail-copy-grid .detail-box.full {
      grid-column: 1 / -1;
    }

    .card-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .card-action {
      border: none;
      cursor: pointer;
      font-family: inherit;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 900;
    }

    .card-action.secondary {
      background: linear-gradient(135deg, #f7efff, #edf7ff);
      color: var(--text);
    }

    @media (max-width: 980px) {
      .card-detail-grid { grid-template-columns: 1fr; }
      .detail-main { gap: 10px; }
      .detail-copy-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 900px) {
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .shell { padding: 20px 14px 32px; }
      .hero-title { font-size: 24px; }
      .summary { grid-template-columns: 1fr; }
      .card-grid { grid-template-columns: 1fr; }
      .egg-card { max-width: 100%; }
    }
  </style>
</head>
<body>

  <div class="shell">
    <section class="hero">
      <div>
        <div class="hero-title"><span class="hero-icon">✨</span><span>全部卡片预览</span></div>
        <div class="hero-sub">这是独立页面，直接展示所有卡片的正面，不受是否已解锁限制。你可以直接看每一张卡的风格、配色、主题和描述，再告诉我想优化哪几张。</div>
      </div>
    </section>

    <section class="summary">
      <div class="summary-card"><div class="k">总卡数</div><div class="v" id="allCount">0</div><div class="t">当前卡池的全部卡片数量</div></div>
      <div class="summary-card"><div class="k">R 卡</div><div class="v" id="rCount">0</div><div class="t">普通卡片</div></div>
      <div class="summary-card"><div class="k">SR 卡</div><div class="v" id="srCount">0</div><div class="t">超级卡片</div></div>
      <div class="summary-card"><div class="k">PR 卡</div><div class="v" id="prCount">0</div><div class="t">稀有卡片</div></div>
      <div class="summary-card"><div class="k">SSR 卡</div><div class="v" id="ssrCount">0</div><div class="t">超级豪华</div></div>
      <div class="summary-card"><div class="k">HR 卡</div><div class="v" id="hrCount">0</div><div class="t">豪华稀有</div></div>
      <div class="summary-card"><div class="k">UR 卡</div><div class="v" id="urCount">0</div><div class="t">超级稀有</div></div>
      <div class="summary-card"><div class="k">CP 卡</div><div class="v" id="cpCount">0</div><div class="t">收藏版</div></div>
      <div class="summary-card"><div class="k">LGR 卡</div><div class="v" id="lgrCount">0</div><div class="t">传说版</div></div>
      <div class="summary-card"><div class="k">SP 卡</div><div class="v" id="spCount">0</div><div class="t">特殊卡片</div></div>
      <div class="summary-card"><div class="k">GP 卡</div><div class="v" id="gpCount">0</div><div class="t">豪华卡片</div></div>
    </section>

    <section class="board" id="board"></section>
  </div>

  <div class="modal" id="cardDetailModal" onclick="closeModalOnMask(event, 'cardDetailModal')">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-head">
        <div class="modal-title" id="detailTitle">卡片详情</div>
        <button class="modal-close" type="button" onclick="closeModal('cardDetailModal')">×</button>
      </div>
      <div class="modal-body" id="cardDetailBody"></div>
    </div>
  </div>

  <script src="cards-data.js?v=1.4.1"></script>
<script>
    if (!window.CARD_DATA) {
    throw new Error('卡片数据模块加载失败：请确认 cards-data.js 已部署。');
  }
  const { CARD_POOL, CARD_ARTWORK, rarityClass, buildEggSvg } = window.CARD_DATA;

  function buildCardTile(card, count = 1, context = '') {
      const cls = rarityClass(card.rarity);
      const seriesCode = `MLP-${card.rarity}-${card.id.slice(-3).toUpperCase()}`;
      return `
        <div class="egg-card ${cls} ${context === 'detail' ? 'card-context-detail' : ''}">
          <div class="egg-card-inner">
            <div class="egg-card-front ${cls}" onclick="openCardDetail('${card.id}')">
              <div class="card-topline">
                <div>
                  <div class="card-name">${card.name}</div>
                  <div class="card-number">${seriesCode}</div>
                </div>
                <span class="rarity-badge ${cls}">${card.rarity}</span>
              </div>
              <div class="card-art">${buildEggSvg(card)}</div>
              <div class="card-footer">
                <div class="card-skill">${card.icon||'🥚'} ${card.skill}<div class="card-series">EGG PARTY</div></div>
                <span class="card-count">x${count}</span>
              </div>
            </div>
          </div>
        </div>`;
    }

    function getCard(cardId) {
      return CARD_POOL.find((card) => card.id === cardId);
    }

    function openCardDetail(cardId) {
      const card = getCard(cardId);
      if (!card) return;
      document.getElementById('detailTitle').textContent = card.name;
      document.getElementById('cardDetailBody').innerHTML = `
        <div class="card-detail-grid">
          <div>${buildCardTile(card, 1, 'detail')}</div>
          <div class="detail-main">
            <div class="detail-headline">
              <div class="detail-name-wrap">
                <div class="detail-name">${card.name}</div>
                <div class="detail-sub">${card.desc||''}</div>
              </div>
            </div>
            <div class="detail-tags">
              <span class="detail-tag">${card.icon||'🥚'} ${card.rarity}卡</span>
              <span class="detail-tag">技能：${card.skill}</span>
            </div>
            <div class="detail-copy-grid">
              <div class="detail-box full">
                <div class="k">卡片介绍</div>
                <div class="v">${card.desc||'蛋仔派对限定卡面，陪你在学习中收集快乐！'}</div>
              </div>
            </div>
          </div>
        </div>
        <div class="card-modal-actions">
          <button class="card-action secondary" type="button" onclick="closeModal('cardDetailModal')">关闭</button>
        </div>`;
      openModal('cardDetailModal');
    }

    function syncOverlayLock() {
      const hasOverlay = document.querySelector('.modal.show');
      document.body.classList.toggle('overlay-open', !!hasOverlay);
    }

    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      if (document.getElementById('cardDetailModal').classList.contains('show')) {
        closeModal('cardDetailModal');
      }
    });

    function openModal(id) {
      document.getElementById(id).classList.add('show');
      syncOverlayLock();
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
      syncOverlayLock();
    }

    function closeModalOnMask(event, id) {
      if (event.target.id === id) closeModal(id);
    }

    function render() {
      const board = document.getElementById('board');
      const ALL_RARITIES = ['R', 'SR', 'PR', 'SSR', 'HR', 'UR', 'CP', 'LGR', 'GP', 'SP'];
      const groups = {};
      ALL_RARITIES.forEach(r => { groups[r] = CARD_POOL.filter(card => card.rarity === r); });

      document.getElementById('allCount').textContent = CARD_POOL.length;
      ALL_RARITIES.forEach(r => {
        document.getElementById(r.toLowerCase() + 'Count').textContent = groups[r].length;
      });

      board.innerHTML = ALL_RARITIES.map((rarity) => `
        <section class="group">
          <div class="group-head">
            <h2><span class="rarity-pill ${rarityClass(rarity)}">${rarity}</span>${rarity} 卡正面预览</h2>
            <div class="group-meta">共 ${groups[rarity].length} 张</div>
          </div>
          <div class="card-grid">
            ${groups[rarity].map((card) => `
              <div class="catalog-tile">
                ${buildCardTile(card)}
                <div class="note">
                  <div class="name">${card.name} · ${card.rarity}</div>
                  <div class="desc">${card.desc||''}<br>${card.icon||'🥚'} ${card.skill}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </section>
      `).join('');
    }

    render();
    syncOverlayLock();
  </script>
</body>
</html>

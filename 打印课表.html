<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每周打卡任务表 · 打印</title>
<script src="cloud-config.js?v=2.0.1"></script>
<script src="cloud-sync.js?v=3.5.0"></script>
<style>
  :root {
    --ink: #1f2433;
    --muted: #6b7280;
    --line: #d7dbe3;
    --cn: #e0597a;
    --en: #4d7ad8;
    --ma: #2ea87e;
    --other: #9b6dd6;
    --pe: #e8822e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: #f3f4f6;
  }

  /* ---------- 工具栏（不打印） ---------- */
  .toolbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--line);
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .toolbar h2 { font-size: 16px; margin: 0 8px 0 0; }
  .toolbar label { font-size: 13px; color: var(--muted); }
  .toolbar input[type="week"], .toolbar input[type="password"] {
    font-size: 14px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px;
  }
  .toolbar .spacer { flex: 1; }
  .btn {
    font-size: 14px; font-weight: 700; padding: 8px 16px; border-radius: 9px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer;
  }
  .btn.primary { background: #6d5efc; border-color: #6d5efc; color: #fff; }
  .btn:active { transform: translateY(1px); }
  .toolbar .hint { font-size: 12px; color: var(--muted); }
  .toolbar .err { color: #d23b3b; font-size: 13px; }

  /* ---------- A4 画布 ---------- */
  .sheet {
    width: 210mm; min-height: 297mm; margin: 16px auto; background: #fff;
    padding: 8mm; box-shadow: 0 2px 12px rgba(0,0,0,.12);
  }
  .sheet-head { text-align: left; margin-bottom: 6mm; }
  .sheet-head h1 { font-size: 22pt; margin: 0 0 3mm; letter-spacing: 1px; }
  .sheet-head .meta { font-size: 11pt; color: var(--muted); }

  /* 2 列网格（周一~周五 5 天 + 1 说明卡） */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
  }
  .card {
    border: 1px dashed #b9bfca;
    padding: 4.5mm 4mm;
    break-inside: avoid;
    min-height: 62mm;
  }
  .card-head {
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 1px solid var(--line); padding-bottom: 4mm; margin-bottom: 3mm;
  }
  .card-weekday { font-size: 15pt; font-weight: 800; }
  .card-date { font-size: 10pt; color: var(--muted); margin-left: 6px; }
  .card-tag {
    font-size: 9pt; color: #fff; background: #9aa3b2; border-radius: 6px;
    padding: 1px 7px; white-space: nowrap;
  }
  .card-tag.custom { background: #e8822e; }
  .card-tag.weekday-rule, .card-tag.weekend-rule { background: #2ea87e; }
  .card-tag.daily { background: #6d5efc; }
  .card-tag.none { background: #c2c8d2; }

  .period { margin: 2mm 0; }
  .period-label {
    font-size: 10.5pt; font-weight: 700; color: var(--muted);
    border-left: 3px solid var(--line); padding-left: 5px; margin-bottom: 2mm;
  }
  .task {
    display: flex; align-items: flex-start; gap: 5px; font-size: 12.5pt;
    line-height: 1.5; padding: 8px 0;
  }
  .chk {
    flex: 0 0 auto; width: 12px; height: 12px; margin-top: 3px;
    border: 1.4px solid #555; border-radius: 2px; background: #fff;
  }
  .badge {
    flex: 0 0 auto; font-size: 9pt; font-weight: 700; border-radius: 5px;
    padding: 0 5px; line-height: 16px; color: #fff;
  }
  .badge.cn { background: var(--cn); }
  .badge.en { background: var(--en); }
  .badge.ma { background: var(--ma); }
  .badge.other { background: var(--other); }
  .badge.pe { background: var(--pe); }
  .task .name { font-weight: 600; }
  .task .detail { color: var(--muted); font-size: 9.5pt; }
  .empty { font-size: 10pt; color: var(--muted); font-style: italic; padding: 4mm 0; text-align: center; }

  /* 说明卡 */
  .card.info { background: #fafbff; }
  .card.info h3 { font-size: 12pt; margin: 0 0 2mm; }
  .card.info ul { margin: 0; padding-left: 16px; font-size: 9.5pt; line-height: 1.7; color: #3a4252; }
  .card.info .cut-tip {
    margin-top: 3mm; font-size: 9.5pt; color: var(--muted);
    border-top: 1px dashed var(--line); padding-top: 2mm;
  }

  /* ---------- 打印样式 ---------- */
  @media print {
    @page { size: A4; margin: 0; }
    body { background: #fff; }
    .toolbar { display: none !important; }
    .sheet { width: auto; min-height: auto; margin: 0; box-shadow: none; padding: 8mm; }
    .card { min-height: 62mm; }
    .badge { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  @media screen and (max-width: 760px) {
    .sheet { width: 100%; min-height: auto; padding: 12px; }
    .grid { grid-template-columns: 1fr; }
    .card { min-height: auto; }
  }
</style>
</head>
<body>
  <div class="toolbar no-print">
    <h2>每周打卡任务表</h2>
    <label for="weekPick">选择周（周一~周日）</label>
    <input type="week" id="weekPick" onchange="onWeekChange()">
    <button class="btn" type="button" onclick="reload()">重新加载</button>
    <span class="spacer"></span>
    <span class="hint" id="authHint"></span>
    <input type="password" id="pwd" placeholder="家长密码" autocomplete="off" style="display:none">
    <button class="btn" type="button" id="authBtn" onclick="authenticate()" style="display:none">加载课表</button>
    <button class="btn primary" type="button" onclick="window.print()">打印</button>
    <div class="err" id="err"></div>
  </div>

  <div class="sheet" id="sheet">
    <div class="sheet-head">
      <h1>每周打卡任务表</h1>
      <div class="meta" id="sheetMeta">请选择周并加载课表</div>
    </div>
    <div class="grid" id="grid">
      <div class="empty" style="grid-column:1/-1;padding:30mm 0">尚未加载课表。请输入家长密码并选择周，点击「加载课表」。</div>
    </div>
  </div>

<script>
  const WEEKDAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  const PERIODS = [['morning', '上午'], ['afternoon', '下午'], ['evening', '晚上']];
  const SUBJECT_LABELS = { cn: '语文', en: '英语', ma: '数学', other: '综合', pe: '体育' };

  let overridesMap = {};   // 'YYYY-MM-DD' -> [tasks]
  let rulesMap = { daily: [], weekday: [], weekend: [] };
  let loadedWeek = null;   // 'YYYY-Www'

  function isPlainObject(v) { return v && typeof v === 'object' && !Array.isArray(v); }
  function normalizeScheduleTasks(raw) {
    if (!Array.isArray(raw) || raw.length > 24) return [];
    const ids = new Set();
    return raw.filter((item) => {
      if (!isPlainObject(item) || !/^[a-zA-Z0-9_-]{2,64}$/.test(String(item.id || '')) ||
          !String(item.name || '').trim() || !['morning', 'afternoon', 'evening'].includes(item.period) ||
          !['cn', 'en', 'ma', 'other', 'pe'].includes(item.subject) || ids.has(item.id)) return false;
      ids.add(item.id);
      return true;
    }).map((item) => ({ id: String(item.id), name: String(item.name).slice(0, 40), detail: String(item.detail || '').slice(0, 120), period: item.period, subject: item.subject }));
  }
  function isWeekend(d) { return d.getDay() === 0 || d.getDay() === 6; }
  function fmtKey(d) {
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function parseKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }

  // ISO 周 -> 该周周一
  function mondayOfISOWeek(weekStr) {
    const [y, w] = weekStr.split('-W').map(Number);
    const jan4 = new Date(Date.UTC(y, 0, 4));
    const jan4Day = (jan4.getUTCDay() || 7);
    const mondayJan4 = new Date(jan4); mondayJan4.setUTCDate(jan4.getUTCDate() - (jan4Day - 1));
    const monday = new Date(mondayJan4); monday.setUTCDate(mondayJan4.getUTCDate() + (w - 1) * 7);
    return monday;
  }
  function isoWeekOf(d) {
    const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dayNum = (date.getUTCDay() || 7);
    date.setUTCDate(date.getUTCDate() - (dayNum - 1)); // 本周一(UTC)
    const jan4 = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
    const jan4Day = (jan4.getUTCDay() || 7);
    const mondayJan4 = new Date(jan4); mondayJan4.setUTCDate(jan4.getUTCDate() - (jan4Day - 1));
    const week = Math.round((date - mondayJan4) / (7 * 24 * 3600 * 1000)) + 1;
    return `${date.getUTCFullYear()}-W${String(week).padStart(2, '0')}`;
  }

  function resolveDay(date) {
    const key = fmtKey(date);
    if (overridesMap[key] && overridesMap[key].length)
      return { mode: 'custom', tag: '单日安排', tasks: overridesMap[key] };
    const wknd = isWeekend(date);
    if (wknd && rulesMap.weekend.length)
      return { mode: 'weekend-rule', tag: '周末', tasks: rulesMap.weekend };
    if (!wknd && rulesMap.weekday.length)
      return { mode: 'weekday-rule', tag: '工作日', tasks: rulesMap.weekday };
    if (rulesMap.daily.length)
      return { mode: 'daily', tag: '每天', tasks: rulesMap.daily };
    return { mode: 'none', tag: '未安排', tasks: [] };
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function taskHtml(t) {
    const subj = SUBJECT_LABELS[t.subject] || '综合';
    const detail = t.detail ? ` <span class="detail">(${escapeHtml(t.detail)})</span>` : '';
    return `<div class="task"><span class="chk"></span><span class="name">${escapeHtml(t.name)}</span>${detail}</div>`;
  }

  function cardHtml(date, idx) {
    const r = resolveDay(date);
    const wd = WEEKDAYS[idx];
    const dateStr = `${date.getMonth() + 1}/${date.getDate()}`;
    let body;
    if (!r.tasks.length) {
      body = `<div class="empty">今日自由安排（无课表）</div>`;
    } else {
      body = PERIODS.map(([p, label]) => {
        const list = r.tasks.filter((t) => t.period === p);
        if (!list.length) return '';
        return `<div class="period"><div class="period-label">${label}</div>${list.map(taskHtml).join('')}</div>`;
      }).join('');
    }
    return `<div class="card">
      <div class="card-head">
        <div><span class="card-weekday">${wd}</span><span class="card-date">${dateStr}</span></div>
      </div>
      ${body}
    </div>`;
  }

  function render() {
    if (!loadedWeek) return;
    const monday = mondayOfISOWeek(loadedWeek);
    const days = [];
    for (let i = 0; i < 5; i++) { // 仅周一~周五
      const d = new Date(monday); d.setDate(monday.getDate() + i); days.push(d);
    }
    const friday = days[4];
    document.getElementById('sheetMeta').textContent =
      `${fmtKey(days[0])}（${WEEKDAYS[0]}） ~ ${fmtKey(friday)}（${WEEKDAYS[4]}） `;
    const cards = days.map((d, i) => cardHtml(d, i)).join('');
    const info = `<div class="card info">
      <h3>使用说明</h3>
      <ul>
        <li>沿卡片之间的虚线裁剪，每天一卡。</li>
        <li>每完成一项，在左侧方框内打「√」。</li>
      </ul>
    </div>`;
    document.getElementById('grid').innerHTML = cards + info;
  }

  function setErr(msg) { document.getElementById('err').textContent = msg || ''; }

  async function fetchSchedule(weekStr) {
    const monday = mondayOfISOWeek(weekStr);
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    const from = fmtKey(monday), to = fmtKey(sunday);
    const r = await window.SummerCloud.invokeAsAdmin('get_schedule', { from, to });
    overridesMap = {};
    (r.overrides || []).forEach((x) => {
      if (/^\d{4}-\d{2}-\d{2}$/.test(x.schedule_date)) overridesMap[x.schedule_date] = normalizeScheduleTasks(x.tasks);
    });
    rulesMap = { daily: [], weekday: [], weekend: [] };
    (r.rules || []).forEach((x) => {
      const k = String(x.schedule_date || '');
      if (k === '__daily__') rulesMap.daily = normalizeScheduleTasks(x.tasks);
      else if (k === '__weekday__') rulesMap.weekday = normalizeScheduleTasks(x.tasks);
      else if (k === '__weekend__') rulesMap.weekend = normalizeScheduleTasks(x.tasks);
    });
    loadedWeek = weekStr;
    render();
  }

  async function reload() {
    const weekStr = document.getElementById('weekPick').value;
    if (!weekStr) { setErr('请先选择周。'); return; }
    if (!window.SummerCloud || !window.SummerCloud.isConfigured()) { setErr('云端未配置，无法加载。'); return; }
    if (!window.SummerCloud.getAdminPassword()) {
      document.getElementById('pwd').style.display = '';
      document.getElementById('authBtn').style.display = '';
      setErr('请输入家长密码后点击「加载课表」。');
      return;
    }
    setErr('');
    try { await fetchSchedule(weekStr); }
    catch (e) { setErr(e.message || '加载失败，请重试。'); }
  }

  async function authenticate() {
    const pwd = document.getElementById('pwd').value.trim();
    if (!pwd) { setErr('请输入家长密码。'); return; }
    window.SummerCloud.setAdminPassword(pwd);
    try {
      // 验证密码：用一次轻量读取
      await window.SummerCloud.invokeAsAdmin('get_schedule', { from: fmtKey(new Date()), to: fmtKey(new Date()) });
      document.getElementById('pwd').style.display = 'none';
      document.getElementById('authBtn').style.display = 'none';
      document.getElementById('authHint').textContent = '已登录';
      setErr('');
      await reload();
    } catch (e) {
      window.SummerCloud.setAdminPassword('');
      setErr(e.message || '家长密码不正确。');
    }
  }

  function onWeekChange() { if (loadedWeek) reload(); }

  // 初始化：默认本周，若已在本机登录（sessionStorage 有密码）则自动加载
  (function init() {
    const def = isoWeekOf(new Date());
    document.getElementById('weekPick').value = def;
    if (window.SummerCloud && window.SummerCloud.isConfigured() && window.SummerCloud.getAdminPassword()) {
      document.getElementById('authHint').textContent = '已登录';
      reload();
    } else {
      document.getElementById('pwd').style.display = '';
      document.getElementById('authBtn').style.display = '';
    }
  })();
</script>
</body>
</html>
